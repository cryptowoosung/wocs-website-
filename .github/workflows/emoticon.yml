name: WOCS Emoticon Auto Generator

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      run_only_first:
        description: '1컷만 생성 (dry-run 검증용)'
        type: boolean
        default: false

jobs:
  generate-emoticons:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'

      - name: Install Korean fonts (Nanum + Noto CJK)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum fonts-nanum-extra fonts-noto-cjk
          sudo fc-cache -fv
          # 설치 검증
          ls -la /usr/share/fonts/truetype/nanum/ | head -20
          fc-list :lang=ko | head -10

      - name: Cache rembg models
        uses: actions/cache@v5
        with:
          path: ~/.u2net
          key: rembg-birefnet-general-v1

      - name: Install dependencies
        run: |
          pip install requests google-auth google-auth-httplib2 google-api-python-client "pillow>=9.1.0" anthropic openai python-dotenv "rembg[cpu]>=2.0.50" onnxruntime "opencv-python-headless>=4.8.0"

      - name: Run Emoticon Generator
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          DRIVE_PARENT_FOLDER_ID: ${{ secrets.DRIVE_PARENT_FOLDER_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          RUN_ONLY_FIRST: ${{ github.event.inputs.run_only_first == 'true' && '1' || '0' }}
        run: |
          python emoticon_generator.py
