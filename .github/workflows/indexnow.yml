name: IndexNow — Naver + Bing

on:
  push:
    branches: [main]
    paths:
      - '**.html'

jobs:
  submit:
    runs-on: ubuntu-latest
    env:
      INDEXNOW_KEY: bc5ada97a10c8516596ea24189a7452a
      SITE_HOST: wocs.kr
    steps:
      - name: Checkout (with history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Collect changed HTML files
        id: collect
        run: |
          set -euo pipefail
          # Compare HEAD with its parent. First push has no parent; fall back to empty tree.
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            CHANGED=$(git diff --name-only --diff-filter=AM HEAD^ HEAD -- '*.html' || true)
          else
            CHANGED=$(git ls-files '*.html')
          fi

          if [ -z "$CHANGED" ]; then
            echo "No HTML changes detected. Skipping IndexNow submission."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed HTML files:"
          echo "$CHANGED"

          # Convert file paths to absolute URLs
          URLS_JSON=$(echo "$CHANGED" | awk -v host="$SITE_HOST" '
            {
              # skip empty
              if ($0 == "") next
              printf "\"https://%s/%s\",", host, $0
            }
          ' | sed 's/,$//')

          URL_LIST="[$URLS_JSON]"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          echo "url_list<<EOF" >> "$GITHUB_OUTPUT"
          echo "$URL_LIST" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Submit to Naver IndexNow
        if: steps.collect.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          PAYLOAD=$(cat <<EOF
          {
            "host": "${SITE_HOST}",
            "key": "${INDEXNOW_KEY}",
            "keyLocation": "https://${SITE_HOST}/${INDEXNOW_KEY}.txt",
            "urlList": ${{ steps.collect.outputs.url_list }}
          }
          EOF
          )
          echo "Payload:"
          echo "$PAYLOAD"
          RESPONSE=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" \
            -X POST "https://searchadvisor.naver.com/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$PAYLOAD")
          echo "Naver response:"
          echo "$RESPONSE"
          STATUS=$(echo "$RESPONSE" | grep -oE 'HTTP_STATUS:[0-9]+' | cut -d: -f2)
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "202" ]; then
            echo "::warning::Naver IndexNow returned $STATUS"
          fi

      - name: Submit to Bing IndexNow
        if: steps.collect.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          PAYLOAD=$(cat <<EOF
          {
            "host": "${SITE_HOST}",
            "key": "${INDEXNOW_KEY}",
            "keyLocation": "https://${SITE_HOST}/${INDEXNOW_KEY}.txt",
            "urlList": ${{ steps.collect.outputs.url_list }}
          }
          EOF
          )
          RESPONSE=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" \
            -X POST "https://www.bing.com/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$PAYLOAD")
          echo "Bing response:"
          echo "$RESPONSE"
          STATUS=$(echo "$RESPONSE" | grep -oE 'HTTP_STATUS:[0-9]+' | cut -d: -f2)
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "202" ]; then
            echo "::warning::Bing IndexNow returned $STATUS"
          fi
