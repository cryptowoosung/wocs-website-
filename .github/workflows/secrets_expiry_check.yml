name: Secrets Expiry Check

on:
  schedule:
    # 매일 UTC 00:00 = KST 09:00
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-expiry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 만료 잔여일 계산
        id: check
        env:
          LI_TOKEN_ISSUED_AT: ${{ vars.LI_TOKEN_ISSUED_AT }}
        run: python check_secrets_expiry.py

      - name: 만료 임박 이슈 자동 생성 (warning/critical만)
        if: steps.check.outputs.alert_level != 'ok'
        uses: actions/github-script@v7
        env:
          ALERT_LEVEL: ${{ steps.check.outputs.alert_level }}
          DAYS_REMAINING: ${{ steps.check.outputs.days_remaining }}
          EXPIRY_DATE: ${{ steps.check.outputs.expiry_date }}
          ISSUED_AT: ${{ steps.check.outputs.issued_at }}
        with:
          script: |
            const level = process.env.ALERT_LEVEL;
            const days = process.env.DAYS_REMAINING;
            const expiry = process.env.EXPIRY_DATE;
            const issued = process.env.ISSUED_AT;
            const emoji = level === 'critical' ? '🔴' : '🟡';
            const title = `${emoji} LinkedIn 토큰 만료 임박 (D-${days}) — ${expiry}`;

            const labels = ['secrets-management', 'automation'];
            if (level === 'critical') labels.push('critical');

            // 중복 방지: 같은 제목의 open 이슈가 있으면 skip
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'secrets-management',
              per_page: 50,
            });
            const dup = existing.data.find(i => i.title === title);
            if (dup) {
              core.info(`이미 동일 이슈 존재 (#${dup.number}) — 새로 만들지 않음`);
              return;
            }

            const body = [
              `## ${emoji} LinkedIn 액세스 토큰 만료 임박`,
              ``,
              `| 항목 | 값 |`,
              `|---|---|`,
              `| 자산 | \`LI_ACCESS_TOKEN\` |`,
              `| 발급일 | ${issued} |`,
              `| 만료예정 | **${expiry}** |`,
              `| 잔여일 | **D-${days}** |`,
              `| 경고 수준 | \`${level}\` |`,
              ``,
              `## 🔧 재발급 절차`,
              ``,
              `1. https://www.linkedin.com/developers/apps 접속`,
              `2. WOCS 앱 선택 → **Auth** 탭 → **OAuth 2.0 token generator**`,
              `3. 권한 스코프 체크:`,
              `   - [ ] \`openid\``,
              `   - [ ] \`profile\``,
              `   - [ ] \`email\``,
              `   - [ ] \`w_member_social\``,
              `4. 발급된 access token 복사`,
              `5. GitHub repo Settings:`,
              `   - **Secrets**: \`LI_ACCESS_TOKEN\` 값 교체`,
              `   - **Variables**: \`LI_TOKEN_ISSUED_AT\` 을 오늘 날짜로 갱신`,
              `6. \`C:\\Users\\user\\secrets\\secrets_status.md\` 도 함께 수정 후 커밋`,
              ``,
              `## ✅ 완료 후`,
              ``,
              `- [ ] LinkedIn 새 토큰 발급`,
              `- [ ] \`LI_ACCESS_TOKEN\` Secret 갱신`,
              `- [ ] \`LI_TOKEN_ISSUED_AT\` Variable 갱신 (오늘 날짜)`,
              `- [ ] \`secrets_status.md\` 갱신 & 커밋`,
              `- [ ] WOCS Auto Blog Writer 워크플로 수동 dispatch로 LinkedIn 포스팅 정상 확인`,
              `- [ ] 본 이슈 close`,
              ``,
              `---`,
              `<sub>이 이슈는 \`.github/workflows/secrets_expiry_check.yml\` 이 자동 생성했습니다.</sub>`,
            ].join('\n');

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: labels,
            });
            core.notice(`이슈 생성: #${issue.data.number} ${title}`);
