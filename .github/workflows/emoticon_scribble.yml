name: WOCS Emoticon Scribble Generator

on:
  workflow_dispatch:
    inputs:
      run_only_first:
        description: '1컷만 생성 (dry-run 검증용)'
        type: boolean
        default: false
  schedule:
    # 화/목/토 KST 02:00 (UTC 17:00) — 쿠로와 번갈아 운영
    # 일요일은 양 트랙 모두 휴식
    - cron: '0 17 * * 2,4,6'

jobs:
  generate-scribble-emoticons:
    runs-on: ubuntu-latest
    # 정상 실행 ~21분. 러너 인프라 지연(checkout 20분·apt 17분 실측)을 흡수하도록
    # 45→90분 상향. 2026-08-18 런은 준비 단계가 29분을 먹어 21/24 컷에서 취소됨.
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'

      - name: Install Korean fonts (Nanum + Noto CJK)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum fonts-nanum-extra fonts-noto-cjk
          sudo fc-cache -fv
          ls -la /usr/share/fonts/truetype/nanum/NanumBrush.ttf
          fc-list :lang=ko | head -10

      - name: Cache rembg models
        uses: actions/cache@v5
        with:
          path: ~/.u2net
          key: rembg-birefnet-general-v1

      - name: Install dependencies
        run: |
          pip install requests google-auth google-auth-httplib2 google-api-python-client "pillow>=9.1.0" anthropic openai python-dotenv "rembg[cpu]>=2.0.50" onnxruntime "opencv-python-headless>=4.8.0"

      - name: Run Scribble Emoticon Generator
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          RUN_ONLY_FIRST: ${{ github.event.inputs.run_only_first == 'true' && '1' || '0' }}
        run: |
          python emoticon_scribble_generator.py
