name: WOCS Auto Blog Writer

on:
  schedule:
    - cron: '0 2 * * 1,4'  # 매주 월·목 02:00 UTC = 11:00 KST 발행
  workflow_dispatch:

permissions:
  contents: write
  actions: read   # 연속 실패 판정용 (이전 실행 결과 조회)

# n8n-webhook.yml과 동일 그룹 → blog-data.js 동시 쓰기 직렬화
concurrency:
  group: blog-write

jobs:
  write-blog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      # 글은 blog-queue 브랜치에 쌓고, main 반영(배포)은 daily-publish.yml 이 매일 09:00 KST 1회만 한다
      - name: 발행 큐 브랜치 준비
        run: |
          git config user.name "WOCS Auto Writer"
          git config user.email "candlejs6@gmail.com"
          bash scripts/blog_queue.sh prepare
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 패키지 설치
        run: pip install "google-genai>=2.34,<3" requests
      - name: 블로그 글 자동 생성
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 제휴 상품 블록 (빈 값이면 블록 생략)
          COUPANG_LINK_1: ${{ secrets.COUPANG_LINK_1 }}
          COUPANG_LINK_2: ${{ secrets.COUPANG_LINK_2 }}
          COUPANG_LINK_3: ${{ secrets.COUPANG_LINK_3 }}
          NAVER_CONNECT_LINK_1: ${{ secrets.NAVER_CONNECT_LINK_1 }}
          NAVER_CONNECT_LINK_2: ${{ secrets.NAVER_CONNECT_LINK_2 }}
          NAVER_CONNECT_LINK_3: ${{ secrets.NAVER_CONNECT_LINK_3 }}
        run: python auto_writer.py
      - name: 실패 시 Telegram 알림
        if: failure()
        run: |
          KST_TIME=$(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M:%S KST')
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG="⚠️ *wocs.kr 자동발행 실패*

          날짜: ${KST_TIME}
          실행 ID: ${{ github.run_id }}

          로그 확인:
          ${RUN_URL}

          복구 방법:
          1. 위 링크에서 실패 step 로그 확인
          2. Gemini API 일시 장애면 같은 워크플로 수동 dispatch
          3. 코드 문제면 수정 후 재실행"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "parse_mode=Markdown" \
            --data-urlencode "text=${MSG}"
      - name: SEO 메타 태그 누락 자동 주입 (safety net)
        run: python scripts/inject_missing_meta.py
        continue-on-error: true
      - name: sitemap.xml 갱신
        run: python update_sitemap.py
      - name: blog.html 목록 정적 폴백 재생성 (크롤러용 서버 렌더 목록)
        run: python scripts/build_blog_static.py
      - name: llms.txt 최신 글 섹션 갱신 (AI 검색엔진용)
        run: python scripts/build_llms_txt.py
      # - name: 워드프레스 자동 포스팅
      #   env:
      #     WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      #   run: python wp_publisher.py
      - name: LinkedIn 자동 포스팅
        env:
          LI_ACCESS_TOKEN: ${{ secrets.LI_ACCESS_TOKEN }}
        run: python linkedin_poster.py
      - name: 발행 큐에 커밋 & 푸시 (main 아님)
        run: |
          bash scripts/blog_queue.sh push "auto: 블로그 글 자동 추가 $(date '+%Y-%m-%d')"

      # 2026-11-12 추가: 직전 실행도 실패였으면 기존 알림과 별도로 '연속 실패'를 강조해 한 번 더 보낸다
      - name: 연속 실패 강조 알림
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TG_TOKEN" ] && exit 0
          # 이번 실행보다 앞선 완료 실행 중 끊김 없이 이어진 실패 횟수 (취소·건너뜀 제외)
          PREV=$(gh run list -R "$GITHUB_REPOSITORY" -w "$GITHUB_WORKFLOW" -L 20 --json databaseId,status,conclusion \
            --jq "[.[] | select(.databaseId < $GITHUB_RUN_ID and .status == \"completed\" and .conclusion != \"cancelled\" and .conclusion != \"skipped\") | .conclusion == \"failure\"] | (index(false) // length)") || exit 0
          STREAK=$((PREV + 1))
          [ "$STREAK" -lt 2 ] && exit 0
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl -s -o /dev/null -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=🚨🚨 [연속 실패 ${STREAK}회] wocs.kr 블로그 글 생성
          ${STREAK}번 연달아 실패했습니다. 일시 오류가 아닐 가능성이 높아 확인이 필요합니다.
          ${RUN_URL}"
